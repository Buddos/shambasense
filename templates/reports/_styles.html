<style>
.report-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.report-header h1{margin:0 0 7px;color:#185239;font-size:25px}
.report-muted{color:#718078;font-size:13px}
.report-actions{display:flex;gap:9px;flex-wrap:wrap}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px}
.report-stat,.report-card{background:#fff;border:1px solid #e3eae5;border-radius:13px;padding:19px;box-shadow:0 5px 20px rgba(18,59,42,.04);margin-bottom:17px}
.report-stat small{display:block;color:#718078;font-size:12px}
.report-stat strong{display:block;color:#185239;font-size:27px;margin-top:7px}
.report-card h2,.report-card h3{color:#185239;margin:0 0 13px;font-size:17px}
.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th,.report-table td{text-align:left;padding:11px 10px;border-bottom:1px solid #e3eae5;vertical-align:top}
.report-table th{color:#52645a;background:#f5faf6;font-weight:700}
.report-table tr:last-child td{border-bottom:0}
.report-link{color:#216b47;font-weight:700;text-decoration:none}
.report-link:hover{text-decoration:underline}
.report-empty{padding:18px;background:#f5faf6;border-radius:9px;color:#718078;font-size:13px}
.report-pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf4ed;color:#185239;font-size:11px;font-weight:700}
.report-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 20px}
.report-detail div{padding:11px 0;border-bottom:1px solid #e3eae5}
.report-detail dt{font-size:11px;color:#718078;margin-bottom:4px}
.report-detail dd{margin:0;color:#24332a;font-size:13px;overflow-wrap:anywhere}
@media(max-width:600px){.report-table{display:block;overflow-x:auto;white-space:nowrap}.report-header h1{font-size:22px}}
</style>
